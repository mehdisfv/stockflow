
<div dir="rtl" class="min-h-screen bg-slate-100">

  <!-- نوار بالایی -->
  <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6">
    <h1 class="text-xl font-bold text-slate-800">
      StockFlow
    </h1>

    <span class="text-sm text-slate-500">
      پنل مدیریت
    </span>
  </header>

  <!-- بدنه اصلی -->
  <div class="flex min-h-[calc(100vh-4rem)]">

    <!-- منوی کناری ثابت -->
    <aside class="w-60 shrink-0 bg-blue-950 text-white p-5">
      <h2 class="text-lg font-bold mb-8">
        منوی اصلی
      </h2>

      <nav class="space-y-2">

        <a routerLink="/"
           routerLinkActive="bg-blue-800"
           [routerLinkActiveOptions]="{ exact: true }"
           class="block rounded-lg px-4 py-3 transition-colors duration-200 hover:bg-blue-900">
          داشبورد
        </a>

        <a routerLink="/products"
           routerLinkActive="bg-blue-800"
           class="block rounded-lg px-4 py-3 hover:bg-blue-900">
          کالاها
        </a>

        <a routerLink="/warehouse"
           routerLinkActive="bg-blue-800"
           class="block rounded-lg px-4 py-3 hover:bg-blue-900">
          انبار
        </a>

        <a routerLink="/sales"
           routerLinkActive="bg-blue-800"
           class="block rounded-lg px-4 py-3 hover:bg-blue-900">
          فروش
        </a>

        <a routerLink="/invoices"
           routerLinkActive="bg-blue-800"
           class="block rounded-lg px-4 py-3 hover:bg-blue-900">
          فاکتورها
        </a>

      </nav>
    </aside>

    <!-- محتوای صفحات فرزند -->
    <main class="flex-1 min-w-0 p-8">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
